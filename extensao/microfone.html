<html lang="pt-BR">

    <title>Permitir microfone · Gravador de Aba</title>
    <link rel="stylesheet" href="estilo.css" />
  </head>
  <body class="pagina">
    <main>
      <h1>Permitir o microfone</h1>

        Para gravar a <strong>sua voz</strong> junto com o som da aba (reunião, por exemplo), o

      <button id="permitir" class="primario">Permitir microfone</button>
      <p id="resultado" class="nota" role="status"></p>
    </main>
    <script src="microfone.js"></script>
  </body>
